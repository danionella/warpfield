[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warpfield"
version = "0.2.2"
description = "GPU-accelerated 3D non-rigid registration"
authors = [
    { name = "jlab.berlin" },
    { name = "Maximilian Hoffmann" },
    { name = "Benjamin Judkewitz" },
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["warpfield", "python"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "mlx>=0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "tqdm",
    "pydantic",
    "pyyaml",
    "h5py",
    "hdf5plugin",
    "nibabel",
    "tifffile",
    "scikit-image",
    "imageio",
    "imageio-ffmpeg",
    "pynrrd",
    "zarr",
]

classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
# NVIDIA GPUs: pick the extra that matches your CUDA driver (`nvidia-smi` shows the highest CUDA version it
# supports). [ctk] brings the CUDA libraries, so no separate CUDA Toolkit install is needed. Not part of the base
# install, so that an existing CuPy (e.g. on Google Colab, or from conda) is not replaced by a mismatched one.
cuda12 = ["cupy-cuda12x[ctk]>=14"]
cuda13 = ["cupy-cuda13x[ctk]>=14"]

[project.urls]
Homepage = "https://github.com/danionella/warpfield"
Documentation = "https://danionella.github.io/warpfield/"

[project.scripts]
warpfield = "warpfield.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["warpfield*"]

[tool.setuptools.package-data]
warpfield = ["recipes/*.yml"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.black]
line-length = 120
skip_magic_trailing_comma = true
